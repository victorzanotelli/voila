<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1 id="form-title">Lucky you! You're our 1,000th visitor</h1>
    </header>
    <main>
        <form action = "" method="get" class="contact-form" id="form">
        <div>
            <label for ="Compagny-name">Compagny name</label>
        <input type = "text" name="Compagny-name" id="Compagny-name" required>
    </div>
        <div>
            <label for ="email">Email</label>
        <input type = "email    " name="email" id="email" required>
        </div>
        <div>
            <label for ="phone">+33</label>
        <input type = "tel" id="phone" name="phone" pattern="[0-9]{9}" required>
        </div>
        <div>
            <label for ="question">Your question here</label>
        <textarea id="question" name="question" rows="4" cols="50" required></textarea>
        </div>
        <button type="submit">Send message</button>
    </form>
    </main>
</body>
</html>
